<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago con PSE - Tu Despensa Online</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
      <script type="module">
         import { CONFIG, UTILS, getAPI_BASE_URL } from './js/config.js';

       // Hacer disponible globalmente
        window.CONFIG = CONFIG;
        window.UTILS = UTILS;
        window.API_BASE_URL = getAPI_BASE_URL();

        console.log('✅CONFIG cargado en pago.html');
        console.log('🌐 API URL:', CONFIG.api.baseUrl);
        console.log('📍 Hostname:', window.location.hostname);  
        
        window.dispatchEvent(new CustomEvent('configLoaded', { 
            detail: { config: CONFIG } 
        }));
        </script>


    
    <style>
            /* ... tus estilos ... */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #2ecc71 0%, #3498db 100%);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            }

            .container {
                background: white;
                border-radius: 20px;
                padding: 40px;
                max-width: 600px;
                width: 100%;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            }

            .logo {
                text-align: center;
                margin-bottom: 30px;
            }

            .logo h1 {
                color: #2ecc71;
                font-size: 28px;
                margin-bottom: 10px;
            }

            .resumen-compra {
                background: #f8f9fa;
                border-radius: 15px;
                padding: 20px;
                margin-bottom: 25px;
            }

            .item-compra {
                display: flex;
                justify-content: space-between;
                padding: 10px 0;
                border-bottom: 1px solid #e0e0e0;
            }

            .item-compra:last-child {
                border-bottom: none;
                font-weight: bold;
                color: #2ecc71;
                font-size: 18px;
                padding-top: 15px;
                margin-top: 10px;
                border-top: 2px solid #2ecc71;
            }

            .amount-display {
                background: linear-gradient(135deg, #2ecc71 0%, #3498db 100%);
                color: white;
                padding: 25px;
                border-radius: 15px;
                text-align: center;
                margin-bottom: 25px;
                box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
            }


            .amount-display .amount {
                font-size: 42px;
                font-weight: bold;
            }

            .wompi-widget-container {
                text-align: center;
                margin: 30px 0;
                padding: 20px;
                border: 2px dashed #e0e0e0;
                border-radius: 15px;
                background: #fafafa;
            }

            .btn {
                width: 100%;
                padding: 15px;
                background: linear-gradient(135deg, #2ecc71 0%, #3498db 100%);
                color: white;
                border: none;
                border-radius: 10px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                margin-top: 10px;
            }

            .btn-secondary {
                background: #95a5a6;
            }

            .loading {
                display: none;
                text-align: center;
                padding: 20px;
            }

            .loading.active {
                display: block;
            }

            .spinner {
                border: 4px solid #f3f3f3;
                border-top: 4px solid #2ecc71;
                border-radius: 50%;
                width: 50px;
                height: 50px;
                animation: spin 1s linear infinite;
                margin: 0 auto 15px;
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }

            .error-message {
                background: #fee;
                color: #c33;
                padding: 12px;
                border-radius: 8px;
                margin-bottom: 20px;
                display: none;
            }

            .error-message.active {
                display: block;
            }

            .info-box {
                background: #e8f5e9;
                padding: 15px;
                border-radius: 10px;
                margin-bottom: 20px;
                font-size: 13px;
                color: #2e7d32;
                border-left: 4px solid #2ecc71;
            }

            .payment-methods-info {
                background: #e3f2fd;
                padding: 15px;
                border-radius: 10px;
                margin: 20px 0;
                text-align: center;
                font-size: 14px;
                color: #1565c0;
            }
       </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1><i class="fas fa-store"></i>Tu Despensa Online</h1>
            <p>Pago seguro - Powered by Wompi</p>
        </div>

        <div class="amount-display">
            <h3>💳 Total a pagar</h3>
            <div class="amount">$<span id="displayAmount">0</span> COP</div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        
        <!-- Resumen de productos -->
        <div id="resumenProductos"></div>

        <!-- Información de métodos de pago -->
        <div class="payment-methods-info">
            <i class="fas fa-credit-card"></i> 
            <strong>Múltiples métodos de pago:</strong> Tarjetas, PSE, Efectivo y más
        </div>

        <!-- Widget de Wompi Checkout -->
        <div class="wompi-widget-container">
            <h3 style="margin-bottom: 20px; color: #333;">
                <i class="fas fa-credit-card"></i> Completa tu pago
            </h3>
            <div id="wompi-widget">
                <!-- El widget de Wompi se cargará aquí -->
            </div>
        </div>

        <button type="button" class="btn btn-secondary" onclick="volverAlCarrito()">
            <i class="fas fa-arrow-left"></i> Volver al carrito
        </button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p><strong>Procesando tu pago...</strong></p>
        </div>
    </div>
    
    <!-- ========================================
     SCRIPTS 
    ======================================== -->
<script>

    // ============================================
    // CONFIGURACIÓN Y FUNCIONES PRINCIPALES
    // ============================================

     let compraInfo = null;
     let wompiPublicKey = 'pub_test_dkLf1eZHmam5Nrs7IqHg8hRBgXccimsy';
 
 
     // Función para cargar configuración de Wompi
        async function loadWompiConfig() {
            try {
                console.log('🔑 Cargando configuración de Wompi...');
                
                const response = await fetch('/api/pagos/config');
                const data = await response.json();
                
                if (!data.publicKey) {
                    throw new Error('No se recibió la llave pública');
                }
                
                wompiPublicKey = data.publicKey;
                console.log('✅ Public Key cargada:', wompiPublicKey.substring(0, 20) + '...');
                return true;
                
            } catch (error) {
                console.error('❌ Error cargando configuración:', error);
                mostrarError('Error al inicializar el sistema de pagos.');
                return false;
            }
        }

        // Función para inicializar el widget de Wompi
        function initializeWompiWidget() {
            if (!compraInfo || !wompiPublicKey) {
                console.error('❌ Faltan datos para inicializar widget');
                return;
            }

            // Generar referencia única
            const reference = generateReference();
            const amountInCents = Math.round(compraInfo.total * 100);

            console.log('🎯 Inicializando widget Wompi:');
            console.log('   Monto:', compraInfo.total, 'COP');
            console.log('   Centavos:', amountInCents);
            console.log('   Referencia:', reference);
            console.log('   Public Key:', wompiPublicKey.substring(0, 20) + '...');

            // Crear script del widget
            const widgetScript = document.createElement('script');
            widgetScript.src = 'https://checkout.wompi.co/widget.js';
            widgetScript.setAttribute('data-render', 'button');
            widgetScript.setAttribute('data-public-key', wompiPublicKey);
            widgetScript.setAttribute('data-currency', 'COP');
            widgetScript.setAttribute('data-amount-in-cents', amountInCents.toString());
            widgetScript.setAttribute('data-reference', reference);
            
            // URL de redirección después del pago
            const redirectUrl = `${window.location.origin}/?payment=success&reference=${reference}`;
            widgetScript.setAttribute('data-redirect-url', redirectUrl);

            // Datos del cliente (usando datos reales de la compra)
            if (compraInfo.userEmail) {
                widgetScript.setAttribute('data-customer-data:email', compraInfo.userEmail);
                widgetScript.setAttribute('data-customer-data:full-name', compraInfo.userName || 'Cliente');
            }

            // Agregar el script al contenedor
            const widgetContainer = document.getElementById('wompi-widget');
            widgetContainer.innerHTML = ''; // Limpiar contenedor
            widgetContainer.appendChild(widgetScript);

            console.log('✅ Widget de Wompi inicializado');
        }

        // Generar referencia única
        function generateReference() {
            const timestamp = Date.now();
            const userId = compraInfo?.userId || 'GUEST';
            const random = Math.floor(Math.random() * 10000);
            return `SUPER-${userId}-${timestamp}-${random}`;
        }

        // Cargar resumen de productos
        function cargarResumenProductos() {
            try {
                compraInfo = JSON.parse(localStorage.getItem('compra_pendiente'));
                
                if (!compraInfo || !compraInfo.items) {
                    console.warn('⚠️ No hay información de compra');
                    return false;
                }
                
                const container = document.getElementById('resumenProductos');
                if (!container) {
                    console.error('❌ Container resumenProductos no encontrado');
                    return false;
                }
                
                const html = `
                    <div class="resumen-compra">
                        <h3><i class="fas fa-shopping-bag"></i> Resumen de tu pedido</h3>
                        ${compraInfo.items.map(item => `
                            <div class="item-compra">
                                <span>${item.nombre} <small>(x${item.cantidad})</small></span>
                                <strong>$${(item.precio * item.cantidad).toLocaleString('es-CO')}</strong>
                            </div>
                        `).join('')}
                        <div class="item-compra">
                            <span>TOTAL</span>
                            <span>$${compraInfo.total.toLocaleString('es-CO')} COP</span>
                        </div>
                    </div>
                `;
                
                container.innerHTML = html;
                
                const displayAmount = document.getElementById('displayAmount');
                if (displayAmount) {
                    displayAmount.textContent = compraInfo.total.toLocaleString('es-CO');
                }
                
                console.log('✅ Resumen cargado:', {
                    items: compraInfo.items.length,
                    total: compraInfo.total
                });
                
                return true;
                
            } catch (error) {
                console.error('❌ Error cargando resumen:', error);
                return false;
            }
        }

        // Función para mostrar errores
        function mostrarError(mensaje) {
            const errorDiv = document.getElementById('errorMessage');
            if (!errorDiv) {
                console.error('❌ Error div no encontrado');
                alert(mensaje);
                return;
            }
            
            errorDiv.textContent = mensaje;
            errorDiv.classList.add('active');
            
            setTimeout(() => {
                errorDiv.classList.remove('active');
            }, 10000);
            
            console.error('🚨', mensaje);
        }

        // Volver al carrito
        function volverAlCarrito() {
            if (confirm('¿Deseas volver al carrito?')) {
                window.location.href = '/';
            }
        }

        // ============================================
        // INICIALIZACIÓN AL CARGAR LA PÁGINA
        // ============================================
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('\n🚀 INICIANDO PÁGINA DE PAGO CON WOMPI CHECKOUT');
            
            try {
                // 1. Verificar compra pendiente
                const compraInfoStr = localStorage.getItem('compra_pendiente');
                
                if (!compraInfoStr) {
                    console.error('❌ No hay compra pendiente');
                    mostrarError('No hay compra pendiente. Redirigiendo...');
                    setTimeout(() => window.location.href = '/', 2000);
                    return;
                }
                
                console.log('✅ Compra pendiente encontrada');

                // 2. Cargar resumen
                const resumenOk = cargarResumenProductos();
                if (!resumenOk) {
                    throw new Error('No se pudo cargar el resumen de productos');
                }

                // 3. Cargar configuración de Wompi
                const configOk = await loadWompiConfig();
                if (!configOk) {
                    throw new Error('No se pudo cargar la configuración de Wompi');
                }

                // 4. Inicializar widget de Wompi
                initializeWompiWidget();

                console.log('✅ PÁGINA DE PAGO LISTA CON WOMPI CHECKOUT');

            } catch (error) {
                console.error('❌ ERROR EN INICIALIZACIÓN:', error);
                mostrarError('Error al inicializar: ' + error.message);
            }
        });
    </script>
</body>
</html>
