<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago con PSE - Tu Despensa Online</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
      <script type="module">
         import { CONFIG, UTILS, getAPI_BASE_URL } from './js/config.js';

       // Hacer disponible globalmente
        window.CONFIG = CONFIG;
        window.UTILS = UTILS;
        window.API_BASE_URL = getAPI_BASE_URL();

        console.log('✅CONFIG cargado en pago.html');
        console.log('🌐 API URL:', CONFIG.api.baseUrl);
        console.log('📍 Hostname:', window.location.hostname);  
        
        window.dispatchEvent(new CustomEvent('configLoaded', { 
            detail: { config: CONFIG } 
        }));
        
        </script>


    
  <style>
        /* ... tus estilos ... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2ecc71 0%, #3498db 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #2ecc71;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .resumen-compra {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .item-compra {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .item-compra:last-child {
            border-bottom: none;
            font-weight: bold;
            color: #2ecc71;
            font-size: 18px;
            padding-top: 15px;
            margin-top: 10px;
            border-top: 2px solid #2ecc71;
        }

        .amount-display {
            background: linear-gradient(135deg, #2ecc71 0%, #3498db 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }

        .amount-display .amount {
            font-size: 42px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2ecc71 0%, #3498db 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-secondary {
            background: #95a5a6;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2ecc71;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .info-box {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #2e7d32;
            border-left: 4px solid #2ecc71;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1><i class="fas fa-store"></i>Tu Despensa Online</h1>
            <p>Pago seguro con PSE - Powered by Wompi</p>
        </div>

        <div class="amount-display">
            <h3>💳 Total a pagar</h3>
            <div class="amount">$<span id="displayAmount">0</span> COP</div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        
        <!-- Resumen de productos -->
        <div id="resumenProductos"></div>

        <form id="paymentForm" style="display: none;">
            <h3 style="margin-bottom: 20px; color: #333;">
                <i class="fas fa-file-invoice-dollar"></i> Información de pago
            </h3>

            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> Correo electrónico *
                </label>
                <input type="email" id="email" required placeholder="tu@email.com">
            </div>

            <div class="form-group">
                <label for="userType">
                    <i class="fas fa-user"></i> Tipo de persona *
                </label>
                <select id="userType" required>
                    <option value="">Selecciona...</option>
                    <option value="0">Persona Natural</option>
                    <option value="1">Persona Jurídica</option>
                </select>
            </div>

            <div class="form-group">
                <label for="legalIdType">
                    <i class="fas fa-id-card"></i> Tipo de documento *
                </label>
                <select id="legalIdType" required>
                    <option value="">Selecciona...</option>
                    <option value="CC">Cédula de Ciudadanía</option>
                    <option value="CE">Cédula de Extranjería</option>
                    <option value="NIT">NIT</option>
                    <option value="PP">Pasaporte</option>
                </select>
            </div>

            <div class="form-group">
                <label for="legalId">
                    <i class="fas fa-hashtag"></i> Número de documento *
                </label>
                <input type="text" id="legalId" required placeholder="1234567890">
            </div>

            <div class="form-group">
                <label for="bank">
                    <i class="fas fa-building-columns"></i> Selecciona tu banco *
                </label>
                <select id="bank" required>
                    <option value="">Cargando bancos...</option>
                </select>
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <i class="fas fa-lock"></i> Pagar con PSE
            </button>

            <button type="button" class="btn btn-secondary" onclick="volverAlCarrito()">
                <i class="fas fa-arrow-left"></i> Volver al carrito
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p><strong>Procesando tu pago...</strong></p>
            <p style="font-size: 12px; color: #666; margin-top: 10px;">
                Serás redirigido al banco en un momento
            </p>
        </div>
    </div>

    
    <!-- ========================================
     SCRIPTS 
    ======================================== -->

     <!-- HTML de la página de pago -->
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script de Wompi -->
    <script src="https://checkout.wompi.co/widget.js"></script>
    

    <!-- 3. ✅ SCRIPT INLINE - Funciones auxiliares y setup -->
    <script>
        // ============================================
        // FUNCIÓN FETCHAPI - ÚNICA Y MEJORADA
        // ============================================
        async function fetchAPI(endpoint, options = {}) {
            // Esperar CONFIG con timeout
            if (!window.CONFIG?.api?.baseUrl) {
                console.log('⏳ Esperando CONFIG...');
                await new Promise((resolve) => {
                    const timeout = setTimeout(() => {
                        console.error('❌ Timeout esperando CONFIG');
                        resolve();
                    }, 5000);
                    
                    window.addEventListener('configLoaded', () => {
                        clearTimeout(timeout);
                        resolve();
                    }, { once: true });
                });
            }
            
            if (!window.CONFIG?.api?.baseUrl) {
                throw new Error('CONFIG no disponible');
            }
            
            const url = `${window.CONFIG.api.baseUrl}${endpoint}`;
            console.log('🌐 Fetching:', url);
            
            try {
                const response = await fetch(url, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...options?.headers
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error('❌ Error en fetchAPI:', error);
                throw error;
            }
        }

        // ============================================
        // FUNCIONES AUXILIARES
        // ============================================
        
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function mostrarError(mensaje) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = mensaje;
            errorDiv.classList.add('active');
            
            setTimeout(() => {
                errorDiv.classList.remove('active');
            }, 8000);
        }

        function volverAlCarrito() {
            if (confirm('¿Deseas volver al carrito?')) {
                window.location.href =  '/';
            }
        }

        // ============================================
        // CARGAR RESUMEN DE PRODUCTOS
        // ============================================
        function cargarResumenProductos() {
            try {
                const compraInfo = JSON.parse(localStorage.getItem('compra_pendiente'));
                
                if (!compraInfo || !compraInfo.items) {
                    console.warn('⚠️ No hay información de compra');
                    return;
                }
                
                const container = document.getElementById('resumenProductos');
                if (!container) return;
                
                const html = `
                    <div class="resumen-compra">
                        <h3><i class="fas fa-shopping-bag"></i> Resumen de tu pedido</h3>
                        ${compraInfo.items.map(item => `
                            <div class="item-compra">
                                <span>${item.nombre} <small>(x${item.cantidad})</small></span>
                                <strong>$${(item.precio * item.cantidad).toLocaleString('es-CO')}</strong>
                            </div>
                        `).join('')}
                        <div class="item-compra">
                            <span>TOTAL</span>
                            <span>$${compraInfo.total.toLocaleString('es-CO')} COP</span>
                        </div>
                    </div>
                `;
                
                container.innerHTML = html;
                
                // Actualizar display de monto
                document.getElementById('displayAmount').textContent = 
                    compraInfo.total.toLocaleString('es-CO');
                
            } catch (error) {
                console.error('❌ Error cargando resumen:', error);
            }
        }

        // ============================================
        // CARGAR BANCOS PSE
        // ============================================
        async function cargarBancos() {
            try {
                console.log('🏦 Cargando bancos PSE...');
                const data = await fetchAPI('/api/pagos/bancos-pse');
                
                const bankSelect = document.getElementById('bank');
                
                if (data.success && data.banks && data.banks.length > 0) {
                    bankSelect.innerHTML = '<option value="">Selecciona tu banco...</option>';
                    
                    data.banks.forEach(bank => {
                        const option = document.createElement('option');
                        option.value = bank.financial_institution_code;
                        option.textContent = bank.financial_institution_name;
                        bankSelect.appendChild(option);
                    });
                    
                    console.log(`✅ ${data.banks.length} bancos cargados`);
                } else {
                    throw new Error('No se recibieron bancos');
                }
            } catch (error) {
                console.error('❌ Error cargando bancos:', error);
                document.getElementById('bank').innerHTML = 
                    '<option value="">Error cargando bancos</option>';
                throw error;
            }
        }

        // ============================================
        // INICIALIZACIÓN AL CARGAR LA PÁGINA
        // ============================================
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🚀 Iniciando página de pago...');
            
            try {
                // 1. Verificar que existe información de compra
                const compraInfo = localStorage.getItem('compra_pendiente');
                if (!compraInfo) {
                    mostrarError('No hay compra pendiente. Redirigiendo...');
                    setTimeout(() => {
                        window.location.href = window.CONFIG?.api?.baseUrl || '/';
                    }, 2000);
                    return;
                }

                // 2. Cargar resumen de productos
                cargarResumenProductos();

                // 3. Cargar bancos
                await cargarBancos();

                // 4. Prellenar email si existe
                const compra = JSON.parse(compraInfo);
                if (compra.userEmail) {
                    document.getElementById('email').value = compra.userEmail;
                }

                // 5. Mostrar formulario
                document.getElementById('paymentForm').style.display = 'block';

                console.log('✅ Página de pago lista');

            } catch (error) {
                console.error('❌ Error inicializando página:', error);
                mostrarError('Error al cargar la página: ' + error.message);
            }
        });
    </script>
    
    <!-- 4. ✅ SCRIPT EXTERNO - Lógica de pago de wompi.js -->
    <script src="js/wompi.js"></script>
</body>
</html>
