<script>

// ============================================
// FUNCIÓN FETCHAPI - VERSION FINAL
// ============================================
async function fetchAPI(endpoint, options = {}) {
    // Esperar a que CONFIG esté disponible
    if (!window.CONFIG?.api?.baseUrl) {
        console.log('⏳ Esperando CONFIG...');
        
        await new Promise((resolve) => {
            if (window.CONFIG?.api?.baseUrl) {
                resolve();
                return;
            }
            
            const timeout = setTimeout(() => {
                console.warn('⚠️ Timeout esperando CONFIG (5s)');
                resolve();
            }, 5000);
            
            window.addEventListener('configLoaded', () => {
                clearTimeout(timeout);
                console.log('✅ CONFIG recibido en fetchAPI');
                resolve();
            }, { once: true });
        });
    }
    
    if (!window.CONFIG?.api?.baseUrl) {
        const error = new Error('CONFIG no disponible después de timeout');
        console.error('❌', error.message);
        throw error;
    }
    
    const url = `${window.CONFIG.api.baseUrl}${endpoint}`;
    
    console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
    console.log('📡 FETCH REQUEST:');
    console.log('   URL:', url);
    console.log('   Method:', options.method || 'GET');
    if (options.body) {
        console.log('   Body:', options.body);
    }
    console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
    
    try {
        const response = await fetch(url, {
            ...options,
            headers: {
                'Content-Type': 'application/json',
                ...options?.headers
            }
        });
        
        console.log('📡 FETCH RESPONSE:');
        console.log('   Status:', response.status);
        console.log('   Status Text:', response.statusText);
        console.log('   OK:', response.ok);
        
        // Leer respuesta como texto primero
        const textResponse = await response.text();
        console.log('   Raw Response:', textResponse.substring(0, 500));
        
        // Intentar parsear como JSON
        let data;
        try {
            data = JSON.parse(textResponse);
        } catch (e) {
            console.error('❌ No se pudo parsear JSON:', e);
            data = {
                success: false,
                error: 'Respuesta inválida del servidor',
                rawResponse: textResponse,
                status: response.status
            };
        }
        
        console.log('   Parsed Data:', data);
        console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n');
        
        // Si la respuesta no es OK, lanzar error
        if (!response.ok) {
            const error = new Error(data.error || data.message || `HTTP ${response.status}`);
            error.status = response.status;
            error.data = data;
            throw error;
        }
        
        return data;
        
    } catch (error) {
        console.error('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        console.error('❌ ERROR EN FETCHAPI:');
        console.error('   URL:', url);
        console.error('   Mensaje:', error.message);
        console.error('   Status:', error.status);
        if (error.data) {
            console.error('   Data:', JSON.stringify(error.data, null, 2));
        }
        console.error('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n');
        throw error;
    }
}

// ============================================
// FUNCIONES AUXILIARES
// ============================================

function mostrarError(mensaje) {
    const errorDiv = document.getElementById('errorMessage');
    if (!errorDiv) {
        console.error('❌ Error div no encontrado');
        alert(mensaje);
        return;
    }
    
    errorDiv.textContent = mensaje;
    errorDiv.classList.add('active');
    
    setTimeout(() => {
        errorDiv.classList.remove('active');
    }, 10000);
    
    console.error('🚨', mensaje);
}

function volverAlCarrito() {
    if (confirm('¿Deseas volver al carrito?')) {
        window.location.href = '/';
    }
}

// ============================================
// CARGAR RESUMEN DE PRODUCTOS
// ============================================
function cargarResumenProductos() {
    try {
        const compraInfo = JSON.parse(localStorage.getItem('compra_pendiente'));
        
        if (!compraInfo || !compraInfo.items) {
            console.warn('⚠️ No hay información de compra');
            return false;
        }
        
        const container = document.getElementById('resumenProductos');
        if (!container) {
            console.error('❌ Container resumenProductos no encontrado');
            return false;
        }
        
        const html = `
            <div class="resumen-compra">
                <h3><i class="fas fa-shopping-bag"></i> Resumen de tu pedido</h3>
                ${compraInfo.items.map(item => `
                    <div class="item-compra">
                        <span>${item.nombre} <small>(x${item.cantidad})</small></span>
                        <strong>$${(item.precio * item.cantidad).toLocaleString('es-CO')}</strong>
                    </div>
                `).join('')}
                <div class="item-compra">
                    <span>TOTAL</span>
                    <span>$${compraInfo.total.toLocaleString('es-CO')} COP</span>
                </div>
            </div>
        `;
        
        container.innerHTML = html;
        
        const displayAmount = document.getElementById('displayAmount');
        if (displayAmount) {
            displayAmount.textContent = compraInfo.total.toLocaleString('es-CO');
        }
        
        console.log('✅ Resumen cargado:', {
            items: compraInfo.items.length,
            total: compraInfo.total
        });
        
        return true;
        
    } catch (error) {
        console.error('❌ Error cargando resumen:', error);
        return false;
    }
}

// ============================================
// CARGAR BANCOS PSE
// ============================================
async function cargarBancos() {
    const bankSelect = document.getElementById('bank');
    
    if (!bankSelect) {
        throw new Error('Select de bancos no encontrado');
    }
    
    try {
        console.log('🏦 Cargando bancos PSE...');
        bankSelect.innerHTML = '<option value="">⏳ Cargando bancos...</option>';
        
        const data = await fetchAPI('/api/pagos/bancos-pse');
        
        if (!data.success) {
            throw new Error(data.error || 'Error en respuesta de bancos');
        }
        
        if (!data.banks || data.banks.length === 0) {
            throw new Error('No se recibieron bancos');
        }
        
        bankSelect.innerHTML = '<option value="">Selecciona tu banco...</option>';
        
        data.banks.forEach(bank => {
            const option = document.createElement('option');
            option.value = bank.financial_institution_code;
            option.textContent = bank.financial_institution_name;
            bankSelect.appendChild(option);
        });
        
        console.log(`✅ ${data.banks.length} bancos cargados`);
        return true;
        
    } catch (error) {
        console.error('❌ Error cargando bancos:', error);
        bankSelect.innerHTML = '<option value="">❌ Error cargando bancos</option>';
        throw error;
    }
}

// ============================================
// INICIALIZACIÓN
// ============================================
document.addEventListener('DOMContentLoaded', async function() {
    console.log('\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
    console.log('🚀 INICIANDO PÁGINA DE PAGO');
    console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
    console.log('⏰ Timestamp:', new Date().toISOString());
    console.log('🌐 URL:', window.location.href);
    console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n');
    
    try {
        // 1. Verificar compra pendiente
        const compraInfo = localStorage.getItem('compra_pendiente');
        
        if (!compraInfo) {
            console.error('❌ No hay compra pendiente en localStorage');
            mostrarError('No hay compra pendiente. Redirigiendo...');
            setTimeout(() => window.location.href = '/', 2000);
            return;
        }
        
        console.log('✅ Compra pendiente encontrada');
        
        try {
            const compra = JSON.parse(compraInfo);
            console.log('📦 Detalle de compra:', {
                items: compra.items?.length || 0,
                total: compra.total,
                email: compra.userEmail || 'No especificado'
            });
        } catch (e) {
            console.error('❌ Error parseando compra:', e);
        }

        // 2. Cargar resumen
        console.log('\n📋 Cargando resumen de productos...');
        const resumenOk = cargarResumenProductos();
        if (!resumenOk) {
            console.warn('⚠️ No se pudo cargar el resumen');
        }

        // 3. Cargar bancos
        console.log('\n🏦 Cargando bancos PSE...');
        try {
            await cargarBancos();
        } catch (error) {
            console.error('❌ Fallo crítico cargando bancos:', error);
            mostrarError('Error al cargar bancos. Verifica tu conexión y recarga la página.');
            return;
        }

        // 4. Prellenar email
        try {
            const compra = JSON.parse(compraInfo);
            if (compra.userEmail) {
                const emailInput = document.getElementById('email');
                if (emailInput) {
                    emailInput.value = compra.userEmail;
                    console.log('✅ Email prellenado:', compra.userEmail);
                }
            }
        } catch (e) {
            console.warn('⚠️ No se pudo prellenar email:', e);
        }

        // 5. Mostrar formulario
        const paymentForm = document.getElementById('paymentForm');
        if (paymentForm) {
            paymentForm.style.display = 'block';
            console.log('✅ Formulario mostrado');
        } else {
            console.error('❌ Formulario no encontrado');
        }

        console.log('\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        console.log('✅ PÁGINA DE PAGO LISTA');
        console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n');

    } catch (error) {
        console.error('\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        console.error('❌ ERROR FATAL EN INICIALIZACIÓN');
        console.error('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        console.error('Error:', error.message);
        console.error('Stack:', error.stack);
        console.error('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n');
        
        mostrarError('Error crítico: ' + error.message);
    }
});

</script>
